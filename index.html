<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DeutschPower</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--c:#fff;--ln:#e5e5e5;--tx:#4b4b4b;--mu:#8a8a8a;--g:#58cc02;--gd:#46a302;--b:#1cb0f6;--bd:#1899d6;--o:#ff9600;--od:#cc7800;--r:#ff4b4b;--rd:#d33a3a}
[data-t=dark]{--bg:#131f24;--c:#1f2c34;--ln:#37464f;--tx:#e8eef1;--mu:#8fa0aa}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-weight:600;font-size:16px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);padding:14px 14px 100px;padding-top:max(14px,env(safe-area-inset-top))}
.v{display:none;max-width:480px;margin:auto}.v.on{display:block;animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
h2{font-size:24px;font-weight:800;margin-bottom:12px}.mu{color:var(--mu);font-size:14px}.row{display:flex;gap:8px;align-items:center}
.card{background:var(--c);border:2px solid var(--ln);border-bottom-width:5px;border-radius:20px;padding:14px;margin-bottom:12px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:16px;font-weight:800;font-size:16px;font-family:inherit;color:#fff;background:var(--g);box-shadow:0 5px 0 var(--gd);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gd)}.bl{background:var(--b);box-shadow:0 5px 0 var(--bd)}.or{background:var(--o);box-shadow:0 5px 0 var(--od)}.gr{background:var(--c);color:var(--mu);border:2px solid var(--ln);box-shadow:0 5px 0 var(--ln)}
.chip{padding:6px 12px;border-radius:14px;border:2px solid var(--ln);font-weight:800;background:var(--c)}
.g{display:grid;gap:10px;margin-bottom:12px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.t{text-align:center;padding:14px 4px;margin:0;font-size:13px;font-weight:800;cursor:pointer}.t b{display:block;font-size:30px;margin-bottom:4px}.t:active{transform:translateY(3px)}
.big{background:var(--g);color:#fff;border-color:var(--gd);font-size:20px;text-transform:uppercase}
.pb{flex:1;height:14px;border-radius:9px;background:var(--ln);overflow:hidden}.pb i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .4s}
.x{border:0;background:none;font-size:24px;color:var(--mu);cursor:pointer}
.dots{display:flex;gap:10px;flex-wrap:wrap}.dot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:0;background:var(--ln);color:var(--mu);box-shadow:0 4px 0 #0002;cursor:pointer;font-size:18px}
.dot.done{background:var(--g);color:#fff;box-shadow:0 4px 0 var(--gd)}.dot.now{background:var(--b);color:#fff;box-shadow:0 4px 0 var(--bd);animation:pl 1.4s infinite}@keyframes pl{50%{transform:scale(1.1)}}
.opt{display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px;border-radius:16px;border:2px solid var(--ln);border-bottom-width:5px;background:var(--c);color:var(--tx);font-weight:700;font-size:16px;font-family:inherit;cursor:pointer}
.opt.ok{border-color:var(--g);background:#58cc0222}.opt.bad{border-color:var(--r);background:#ff4b4b22}
.say{border:0;background:var(--b);color:#fff;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;box-shadow:0 4px 0 var(--bd)}
.de{font-size:30px;font-weight:800;margin:8px 0}.tip{background:#ffc80033;border-radius:14px;padding:12px;margin-top:12px;font-size:15px}
#ov{position:fixed;inset:0;background:var(--bg);z-index:20;padding:14px;padding-top:max(14px,env(safe-area-inset-top));overflow:auto;display:none}#ov>div{max-width:480px;margin:auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:2px solid var(--ln);padding:6px 6px max(8px,env(safe-area-inset-bottom));z-index:9}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:11px;font-weight:800;padding:6px 0;border-radius:14px;font-family:inherit}nav b{display:block;font-size:22px}nav .on{color:var(--b);background:#1cb0f622}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.day{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;background:var(--ln);color:var(--mu);font-weight:800;font-size:14px}.day.p{background:var(--g);color:#fff}.day.n{background:var(--b);color:#fff}
.av{width:90px;height:90px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-size:44px;background:var(--b);margin:0 auto 10px}
</style></head><body>
<main id="home" class="v on"></main><main id="learn" class="v"></main><main id="game" class="v"></main><main id="dict" class="v"></main><main id="me" class="v"></main><main id="plan" class="v"></main>
<div id="ov"><div id="ovc"></div></div>
<nav><button data-v="home" class="on"><b>🏠</b>Bosh</button><button data-v="learn"><b>📚</b>O'rganish</button><button data-v="game"><b>🎮</b>O'yin</button><button data-v="dict"><b>📖</b>Lug'at</button><button data-v="me"><b>👤</b>Profil</button></nav>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const $=s=>document.querySelector(s),shuf=a=>[...a].sort(()=>Math.random()-.5),msg=t=>tg.showAlert?tg.showAlert(t):alert(t);
let S={xp:0,streak:0,day:"",today:0,theme:matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light",snd:1,done:{},mist:[],start:"",best:0},T=[],V={},AC,OVC,cur="home",R={};
try{Object.assign(S,JSON.parse(localStorage.dp2||"{}"))}catch(e){}
const ds=o=>new Date(Date.now()-o*864e5).toISOString().slice(0,10);
if(S.day!==ds(0)){S.streak=S.day===ds(1)?S.streak+1:1;S.day=ds(0);S.today=0}if(!S.start)S.start=ds(0);
const save=()=>{try{localStorage.dp2=JSON.stringify(S);tg.CloudStorage.setItem("dp2",JSON.stringify(S))}catch(e){}};
function theme(){document.documentElement.dataset.t=S.theme;try{tg.setHeaderColor(S.theme=="dark"?"#131f24":"#ffffff");tg.setBackgroundColor(S.theme=="dark"?"#131f24":"#ffffff")}catch(e){}}theme();
function snd(k){if(!S.snd)return;try{AC=AC||new AudioContext();const n=AC.currentTime;({ok:[[660,0],[880,.1]],bad:[[220,0],[160,.12]],win:[[523,0],[659,.12],[784,.24],[1047,.36]]})[k].forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.25,n+t);g.gain.exponentialRampToValueAtTime(.001,n+t+.2);o.connect(g).connect(AC.destination);o.start(n+t);o.stop(n+t+.22)})}catch(e){}
try{tg.HapticFeedback.notificationOccurred(k=="bad"?"error":"success")}catch(e){}}
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const gain=n=>{S.xp+=n;S.today+=n;save()};
const top=()=>`<div class="row" style="margin-bottom:14px"><span class="chip">🔥 ${S.streak}</span><span class="chip">⭐ ${S.xp}</span><span class="chip" style="margin-left:auto">🎯 ${Math.min(S.today,50)}/50</span></div>`;
const flat=()=>T.flatMap((t,ti)=>t.l.map((l,li)=>({l,ti,li,k:ti+"-"+li})));
const nextL=()=>flat().find(x=>x.l.p&&!S.done[x.k]);
function go(v){cur=v;document.querySelectorAll(".v").forEach(e=>e.classList.toggle("on",e.id==v));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==v));R[v]();scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
const ov=h=>{$("#ovc").innerHTML=h;$("#ov").style.display="block"},cl=()=>{OVC&&OVC();OVC=0;$("#ov").style.display="none";R[cur]()};
const hd=p=>`<div class="row" style="margin-bottom:18px"><button class="x" onclick="cl()">✕</button><div class="pb"><i style="width:${p*100}%"></i></div></div>`;
const tile=(e,n,f)=>`<div class="card t" onclick="${f}"><b>${e}</b>${n}</div>`;
R.home=()=>{const n=nextL();$("#home").innerHTML=top()+(n?`<div class="card"><div class="mu">Davom etish</div><h2 style="margin:4px 0 10px">${T[n.ti].i} ${n.l.t}</h2><button class="btn" onclick="lesson(${n.ti},${n.li})">Boshlash</button></div>`:"")+
`<div class="g g3">${tile("🔁","Takrorlash","review()")}${tile("📅","Kunlik mashq","daily()")}${tile("📚","Darslar","go('learn')")}</div>
<div class="card t big" onclick="go('game')"><b>🎮</b>O'yinga kirish</div>
<div class="g g2">${tile("📖","Lug'at","go('dict')")}${tile("🗓","90 kunlik reja","go('plan')")}${tile("🎙","Gapirish","tg.openTelegramLink('https://t.me/DeutschMasterUzBot')")}${tile("📝","Mock imtihon","msg('📝 Mock imtihon keyingi bosqichda qo\\'shiladi')")}</div>`};
R.learn=()=>{const nx=nextL();$("#learn").innerHTML=top()+"<h2>O'rganish</h2>"+T.map((t,ti)=>`<div class="card"><div style="font-weight:800;font-size:18px;margin-bottom:10px">${t.i} ${ti+1}. ${t.n}</div><div class="dots">${t.l.map((l,li)=>{const k=ti+"-"+li,d=S.done[k],now=nx&&nx.k==k;return `<button class="dot ${d?"done":now?"now":""}" onclick="${d||now?`lesson(${ti},${li})`:`msg('${l.p?"Avval oldingi darsni tugating":"Bu dars tez orada qo\\'shiladi"}')`}">${d?"✓":l.p?li+1:"🔒"}</button>`}).join("")}</div></div>`).join("")};
function lesson(ti,li){const l=T[ti].l[li],P=l.p;let i=0;const step=()=>{if(i>=P.length+(l.g?1:0))return qz();if(i==P.length)return ov(hd(.8)+`<h2>💡 Qoida</h2><div class="card">${l.g}</div><button class="btn" onclick="nxt()">Davom etish</button>`);const[a,b]=P[i];ov(hd(i/(P.length+1))+`<div class="mu">${l.t}</div><div class="card" style="text-align:center"><div class="de">${a}</div><button class="say" onclick="say('${a.replace(/'/g,"\\'")}')">🔊</button><p style="margin-top:12px;font-size:18px">${b}</p></div><button class="btn" onclick="nxt()">Keyingi</button>`);say(a)};
window.nxt=()=>{i++;step()};const qz=()=>quiz(shuf(P).slice(0,5),P.concat(T.flatMap(t=>t.l.flatMap(x=>x.p||[]))),l.t,(sc,n)=>{S.done[ti+"-"+li]=1;gain(15+sc*3);snd("win");ov(`<div style="text-align:center;padding-top:60px"><div style="font-size:80px">🎉</div><h2>Dars tugadi!</h2><p class="mu">${sc}/${n} to'g'ri • +${15+sc*3} XP</p><br><button class="btn" onclick="cl()">Davom etish</button></div>`)});step()}
function quiz(items,pool,title,fin){let i=0,sc=0,lk=0,c;const q=()=>{if(i>=items.length)return fin(sc,items.length);c=items[i];const o=shuf([c[1],...shuf(pool.filter(p=>p[1]!=c[1])).slice(0,3).map(p=>p[1])]);window.o=o;ov(hd(i/items.length)+`<div class="mu">${title}</div><div class="card" style="text-align:center"><p class="mu">Tarjimasi qaysi?</p><div class="de">${c[0]}</div><button class="say" onclick="say('${c[0].replace(/'/g,"\\'")}')">🔊</button></div>`+o.map((x,j)=>`<button class="opt" onclick="pk(${j})">${x}</button>`).join("")+`<div id="fb"></div>`);lk=0};
window.pk=j=>{if(lk)return;lk=1;const ok=window.o[j]==c[1],b=document.querySelectorAll(".opt");b[j].classList.add(ok?"ok":"bad");if(!ok){b[window.o.indexOf(c[1])].classList.add("ok");if(!S.mist.some(m=>m[0]==c[0]))S.mist.push([c[0],c[1]])}else sc++;snd(ok?"ok":"bad");save();$("#fb").innerHTML=`<button class="btn ${ok?"":"or"}" onclick="qn()">Davom etish</button>`};window.qn=()=>{i++;q()};q()}
const allW=()=>Object.values(V).flat();
const daily=()=>quiz(shuf(allW()).slice(0,10),allW(),"Kunlik mashq",(sc,n)=>{gain(sc*3);snd("win");ov(`<div style="text-align:center;padding-top:60px"><div style="font-size:80px">${sc>7?"🏆":"💪"}</div><h2>${sc}/${n}</h2><p class="mu">+${sc*3} XP</p><br><button class="btn" onclick="cl()">Yopish</button></div>`)});
function review(){if(!S.mist.length)return msg("🎉 Xatolar daftari bo'sh! Xato qilsangiz, so'zlar shu yerga tushadi.");const L=shuf(S.mist);let i=0;const s=()=>{if(i>=L.length)return cl();ov(hd(i/L.length)+`<h2>🔁 Takrorlash</h2><div class="card" style="text-align:center"><div class="de">${L[i][0]}</div><p class="mu" id="tr" style="font-size:20px;margin:10px 0">Tarjimani ko'rish uchun bosing</p></div><button class="btn bl" onclick="$('#tr').textContent='${L[i][1].replace(/'/g,"\\'")}'">Ko'rsatish</button><button class="btn" onclick="rk(1)">✅ Esladim</button><button class="btn or" onclick="rk(0)">🔁 Yana takror</button>`);say(L[i][0])};window.rk=y=>{if(y){S.mist=S.mist.filter(m=>m[0]!=L[i][0]);gain(5);snd("ok");save()}i++;s()};s()}
R.game=()=>{$("#game").innerHTML=top()+`<h2>O'yin</h2><div class="card"><h2 style="font-size:20px">⚡ Artikl Blitz</h2><p class="mu" style="margin-bottom:10px">45 soniyada der/die/das ni toping. Rekord: ${S.best}</p><button class="btn" onclick="blitz()">O'ynash</button></div><div class="card"><h2 style="font-size:20px">⚔️ So'z jangi (do'stlar bilan)</h2><p class="mu" style="margin-bottom:10px">Xona oching, do'stlaringiz qo'shilsin, kim ko'p so'z topsa g'olib. Server qismi tayyor bo'lgach ochiladi.</p><button class="btn gr" onclick="msg('⚔️ Tez orada! Hozir Artikl Blitz bilan mashq qiling.')">🔒 Tez orada</button></div>`};
function blitz(){const N=shuf(allW().filter(w=>/^(der|die|das) /.test(w[0])));let i=0,sc=0,t=45,a;const iv=setInterval(()=>{t--;const e=$("#tm");if(e)e.textContent="⏱ "+t;if(t<=0){clearInterval(iv);end()}},1000);OVC=()=>clearInterval(iv);
const q=()=>{const w=N[i%N.length][0];a=w.split(" ")[0];ov(hd(1-t/45)+`<div class="row" style="justify-content:space-between"><b id="tm">⏱ ${t}</b><b>✅ ${sc}</b></div><div class="card" style="text-align:center;margin-top:14px"><p class="mu">Qaysi artikl?</p><div class="de">${w.slice(a.length+1)}</div></div><div class="g g3">${["der","die","das"].map(x=>`<button class="btn bl" onclick="ap('${x}')">${x}</button>`).join("")}</div>`)};
window.ap=x=>{if(x==a){sc++;snd("ok");gain(2)}else{snd("bad");t=Math.max(1,t-3)}i++;q()};
const end=()=>{OVC=0;if(sc>S.best)S.best=sc;save();snd("win");ov(`<div style="text-align:center;padding-top:60px"><div style="font-size:80px">⚡</div><h2>${sc} ta to'g'ri</h2><p class="mu">Rekord: ${S.best}</p><br><button class="btn" onclick="cl()">Yopish</button></div>`)};q()}
R.dict=()=>{$("#dict").innerHTML=top()+`<h2>Lug'at</h2><input id="sq" placeholder="Qidirish..." style="width:100%;padding:12px;border-radius:14px;border:2px solid var(--ln);background:var(--c);color:var(--tx);font-size:16px;margin-bottom:12px"><div id="dl"></div>`;const f=()=>{const s=$("#sq").value.toLowerCase();$("#dl").innerHTML=allW().filter(w=>(w[0]+w[1]).toLowerCase().includes(s)).map(w=>`<div class="card row" style="padding:10px 14px;margin-bottom:8px"><div style="flex:1"><b>${w[0]}</b><div class="mu">${w[1]}</div></div><button class="say" onclick="say(this.dataset.w)" data-w="${w[0]}">🔊</button></div>`).join("")};$("#sq").oninput=f;f()};
R.plan=()=>{const d=Math.floor((Date.now()-new Date(S.start))/864e5)+1,F=flat();$("#plan").innerHTML=`<div class="row"><button class="x" onclick="go('home')">←</button><h2 style="margin:0">90 kunlik reja</h2></div><p class="mu" style="margin:8px 0 14px">Bugun: ${d}-kun. Har kuni bitta dars va kunlik mashq.</p><div class="days">${[...Array(90)].map((_,i)=>`<div class="day ${i+1<d?"p":i+1==d?"n":""}" onclick="msg('${i+1}-kun: ${i<F.length?F[i].l.t.replace(/'/g,"\\'"):"Takrorlash va mock imtihon"}')">${i+1}</div>`).join("")}</div>`};
R.me=()=>{const u=tg.initDataUnsafe?.user||{},rk=S.xp>=1500?"👑 Meister":S.xp>=500?"⚡ Profi":S.xp>=100?"🔍 Entdecker":"🌱 Anfänger";$("#me").innerHTML=`<div class="card" style="text-align:center">${u.photo_url?`<img class="av" src="${u.photo_url}">`:`<div class="av">🙂</div>`}<h2 style="margin:0">${u.first_name||"O'quvchi"}</h2><p class="mu">${rk}</p></div><div class="g g3"><div class="card t"><b>🔥</b>${S.streak} kun</div><div class="card t"><b>⭐</b>${S.xp} XP</div><div class="card t"><b>✅</b>${Object.keys(S.done).length} dars</div></div><button class="btn bl" onclick="S.theme=S.theme=='dark'?'light':'dark';save();theme();R.me()">${S.theme=="dark"?"☀️ Yorug' rejim":"🌙 Qorong'u rejim"}</button><button class="btn or" onclick="S.snd=S.snd?0:1;save();R.me()">${S.snd?"🔊 Ovoz yoqilgan":"🔇 Ovoz o'chirilgan"}</button>`};
Promise.all([fetch("vocab.json").then(r=>r.json()),fetch("lessons.json").then(r=>r.json())]).then(([v,t])=>{V=v;T=t;go("home")}).catch(()=>{document.body.innerHTML="<p style='padding:30px'>⚠️ Fayllar yuklanmadi</p>"});
</script></body></html>
