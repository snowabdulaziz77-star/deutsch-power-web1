<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DeutschPower</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f7f8fa;--c:#fff;--ln:#e5e7eb;--tx:#111827;--mu:#6b7280;--ac:#2563eb;--ad:#1d4ed8;--ok:#16a34a;--bad:#dc2626}
[data-t=dark]{--bg:#0f1115;--c:#181b21;--ln:#272b33;--tx:#f3f4f6;--mu:#9ca3af;--ac:#3b82f6;--ad:#2563eb}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-weight:500;font-size:15px;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);padding:16px 16px 92px;padding-top:max(16px,env(safe-area-inset-top))}
.v{display:none;max-width:480px;margin:auto}.v.on{display:block;animation:in .25s}@keyframes in{from{opacity:0}}
h2{font-size:22px;font-weight:700;margin-bottom:12px;letter-spacing:-.3px}.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center}
.card{background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:12px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;font-weight:600;font-size:15px;font-family:inherit;color:#fff;background:var(--ac);margin-bottom:10px;cursor:pointer}
.btn:active{background:var(--ad)}.or{background:var(--tx);color:var(--bg)}.gr{background:var(--c);color:var(--tx);border:1px solid var(--ln)}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--ln);font-weight:600;font-size:13px;background:var(--c)}
.g{display:grid;gap:10px;margin-bottom:12px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.t{text-align:center;padding:16px 4px;margin:0;font-size:13px;font-weight:600;cursor:pointer}.t .ic{display:block;margin:0 auto 8px;color:var(--ac)}
.big{background:var(--ac);color:#fff;border-color:var(--ac);font-size:16px;margin-bottom:12px}.big .ic{color:#fff}
.pb{flex:1;height:8px;border-radius:9px;background:var(--ln);overflow:hidden}.pb i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .4s}
.x{border:0;background:none;font-size:22px;color:var(--mu);cursor:pointer}
.dots{display:flex;gap:10px;flex-wrap:wrap}.dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:600;border:1px solid var(--ln);background:var(--bg);color:var(--mu);cursor:pointer;font-size:15px}
.dot.done{background:var(--ac);border-color:var(--ac);color:#fff}.dot.now{border:2px solid var(--ac);color:var(--ac)}
.opt{display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px;border-radius:12px;border:1px solid var(--ln);background:var(--c);color:var(--tx);font-weight:500;font-size:15px;font-family:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:#16a34a18}.opt.bad{border-color:var(--bad);background:#dc262618}
.say{border:1px solid var(--ln);background:var(--c);color:var(--ac);border-radius:50%;width:40px;height:40px;cursor:pointer;display:inline-grid;place-items:center}
.de{font-size:28px;font-weight:700;margin:8px 0;letter-spacing:-.5px}.tip{background:var(--bg);border-radius:10px;padding:12px;margin-top:12px;font-size:14px}
#ov{position:fixed;inset:0;background:var(--bg);z-index:20;padding:16px;padding-top:max(16px,env(safe-area-inset-top));overflow:auto;display:none}#ov>div{max-width:480px;margin:auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--ln);padding:6px 6px max(8px,env(safe-area-inset-bottom));z-index:9}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:11px;font-weight:600;padding:6px 0;font-family:inherit}nav .ic{display:block;margin:0 auto 3px}nav .on{color:var(--ac)}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.day{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;background:var(--c);border:1px solid var(--ln);color:var(--mu);font-weight:600;font-size:13px}.day.p{background:var(--ac);border-color:var(--ac);color:#fff}.day.n{border:2px solid var(--ac);color:var(--ac)}
.av{width:84px;height:84px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-size:34px;font-weight:700;background:var(--ac);color:#fff;margin:0 auto 10px}
.rs{width:72px;height:72px;border-radius:50%;background:var(--ac);margin:0 auto 14px;position:relative}.rs:after{content:"";position:absolute;left:25px;top:16px;width:18px;height:30px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg)}
.st{margin:0;padding:14px}.st b{display:block;font-size:20px;font-weight:700;margin-bottom:2px}
.wk{display:flex;gap:8px;align-items:flex-end;height:90px}.wk div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.wk i{display:block;border-radius:6px;background:var(--ac);min-height:3px;margin-bottom:4px}
</style></head><body><svg width="0" height="0" style="position:absolute"><defs><symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></symbol><symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></symbol><symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></symbol><symbol id="i-book" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol><symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol><symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol><symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></symbol><symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/></symbol><symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></symbol><symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol></defs></svg>
<main id="home" class="v on"></main><main id="learn" class="v"></main><main id="game" class="v"></main><main id="dict" class="v"></main><main id="me" class="v"></main><main id="plan" class="v"></main>
<div id="ov"><div id="ovc"></div></div>
<nav><button data-v="home" class="on"><svg class="ic"><use href="#i-home"/></svg>Bosh</button><button data-v="learn"><svg class="ic"><use href="#i-layers"/></svg>O'rganish</button><button data-v="game"><svg class="ic"><use href="#i-zap"/></svg>O'yin</button><button data-v="dict"><svg class="ic"><use href="#i-book"/></svg>Lug'at</button><button data-v="me"><svg class="ic"><use href="#i-user"/></svg>Profil</button></nav>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const $=s=>document.querySelector(s),shuf=a=>[...a].sort(()=>Math.random()-.5),msg=t=>tg.showAlert?tg.showAlert(t):alert(t);
let S={xp:0,streak:0,day:"",today:0,theme:matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light",snd:1,done:{},mist:[],start:"",best:0,bs:0,qt:0,qo:0,time:0,kw:{},hist:{},goal:50},T=[],V={},AC,OVC,cur="home",R={};
try{Object.assign(S,JSON.parse(localStorage.dp2||"{}"))}catch(e){}
const ds=o=>new Date(Date.now()-o*864e5).toISOString().slice(0,10);
if(S.day!==ds(0)){S.streak=S.day===ds(1)?S.streak+1:1;S.day=ds(0);S.today=0}if(!S.start)S.start=ds(0);S.bs=Math.max(S.bs||0,S.streak);
const save=()=>{try{localStorage.dp2=JSON.stringify(S);tg.CloudStorage.setItem("dp2",JSON.stringify(S))}catch(e){}};
function theme(){document.documentElement.dataset.t=S.theme;try{tg.setHeaderColor(S.theme=="dark"?"#0f1115":"#f7f8fa");tg.setBackgroundColor(S.theme=="dark"?"#0f1115":"#f7f8fa")}catch(e){}}theme();
function snd(k){if(!S.snd)return;try{AC=AC||new AudioContext();const n=AC.currentTime;({ok:[[660,0],[880,.1]],bad:[[220,0],[160,.12]],win:[[523,0],[659,.12],[784,.24],[1047,.36]]})[k].forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.25,n+t);g.gain.exponentialRampToValueAtTime(.001,n+t+.2);o.connect(g).connect(AC.destination);o.start(n+t);o.stop(n+t+.22)})}catch(e){}
try{tg.HapticFeedback.notificationOccurred(k=="bad"?"error":"success")}catch(e){}}
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
const gain=n=>{S.xp+=n;S.today+=n;S.hist[ds(0)]=(S.hist[ds(0)]||0)+n;save()};
const hdr=()=>`<div class="row" style="margin-bottom:14px"><span class="chip">Streak ${S.streak}</span><span class="chip">${S.xp} XP</span><span class="chip" style="margin-left:auto">Maqsad ${Math.min(S.today,S.goal)}/${S.goal}</span></div>`;
const flat=()=>T.flatMap((t,ti)=>t.l.map((l,li)=>({l,ti,li,k:ti+"-"+li})));
const nextL=()=>flat().find(x=>x.l.p&&!S.done[x.k]);
function go(v){cur=v;document.querySelectorAll(".v").forEach(e=>e.classList.toggle("on",e.id==v));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==v));R[v]();scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
const ov=h=>{$("#ovc").innerHTML=h;$("#ov").style.display="block"},cl=()=>{OVC&&OVC();OVC=0;$("#ov").style.display="none";R[cur]()};
const hd=p=>`<div class="row" style="margin-bottom:18px"><button class="x" onclick="cl()">✕</button><div class="pb"><i style="width:${p*100}%"></i></div></div>`;
const tile=(e,n,f)=>`<div class="card t" onclick="${f}"><svg class="ic"><use href="#i-${e}"/></svg>${n}</div>`;
R.home=()=>{const n=nextL();$("#home").innerHTML=hdr()+(n?`<div class="card"><div class="mu">Davom etish</div><h2 style="margin:4px 0 10px">${n.l.t}</h2><button class="btn" onclick="lesson(${n.ti},${n.li})">Boshlash</button></div>`:"")+
`<div class="g g3">${tile("repeat","Takrorlash","review()")}${tile("cal","Kunlik mashq","daily()")}${tile("layers","Darslar","go('learn')")}</div>
<div class="card t big" onclick="go('game')"><svg class="ic"><use href="#i-zap"/></svg>O'yinga kirish</div>
<div class="g g2">${tile("book","Lug'at","go('dict')")}${tile("flag","90 kunlik reja","go('plan')")}${tile("mic","Gapirish","tg.openTelegramLink('https://t.me/DeutschMasterUzBot')")}${tile("file","Mock imtihon","msg(' Mock imtihon keyingi bosqichda qo\\'shiladi')")}</div>`};
R.learn=()=>{const nx=nextL();$("#learn").innerHTML=hdr()+"<h2>O'rganish</h2>"+T.map((t,ti)=>`<div class="card"><div style="font-weight:800;font-size:18px;margin-bottom:10px">${ti+1}. ${t.n}</div><div class="dots">${t.l.map((l,li)=>{const k=ti+"-"+li,d=S.done[k],now=nx&&nx.k==k;return `<button class="dot ${d?"done":now?"now":""}" onclick="${d||now?`lesson(${ti},${li})`:`msg('${l.p?"Avval oldingi darsni tugating":"Bu dars tez orada qo\\'shiladi"}')`}">${d?"✓":l.p?li+1:"•"}</button>`}).join("")}</div></div>`).join("")};
function lesson(ti,li){const l=T[ti].l[li],P=l.p;let i=0;const step=()=>{if(i>=P.length+(l.g?1:0))return qz();if(i==P.length)return ov(hd(.8)+`<h2> Qoida</h2><div class="card">${l.g}</div><button class="btn" onclick="nxt()">Davom etish</button>`);const[a,b]=P[i];ov(hd(i/(P.length+1))+`<div class="mu">${l.t}</div><div class="card" style="text-align:center"><div class="de">${a}</div><button class="say" onclick="say('${a.replace(/'/g,"\\'")}')"><svg class="ic" style="width:20px;height:20px"><use href="#i-vol"/></svg></button><p style="margin-top:12px;font-size:18px">${b}</p></div><button class="btn" onclick="nxt()">Keyingi</button>`);say(a)};
window.nxt=()=>{i++;step()};const qz=()=>quiz(shuf(P).slice(0,5),P.concat(T.flatMap(t=>t.l.flatMap(x=>x.p||[]))),l.t,(sc,n)=>{S.done[ti+"-"+li]=1;gain(15+sc*3);snd("win");ov(`<div style="text-align:center;padding-top:60px"><div class="rs"></div><h2>Dars tugadi!</h2><p class="mu">${sc}/${n} to'g'ri • +${15+sc*3} XP</p><br><button class="btn" onclick="cl()">Davom etish</button></div>`)});step()}
function quiz(items,pool,title,fin){let i=0,sc=0,lk=0,c;const q=()=>{if(i>=items.length)return fin(sc,items.length);c=items[i];const o=shuf([c[1],...shuf(pool.filter(p=>p[1]!=c[1])).slice(0,3).map(p=>p[1])]);window.o=o;ov(hd(i/items.length)+`<div class="mu">${title}</div><div class="card" style="text-align:center"><p class="mu">Tarjimasi qaysi?</p><div class="de">${c[0]}</div><button class="say" onclick="say('${c[0].replace(/'/g,"\\'")}')"><svg class="ic" style="width:20px;height:20px"><use href="#i-vol"/></svg></button></div>`+o.map((x,j)=>`<button class="opt" onclick="pk(${j})">${x}</button>`).join("")+`<div id="fb"></div>`);lk=0};
window.pk=j=>{if(lk)return;lk=1;const ok=window.o[j]==c[1],b=document.querySelectorAll(".opt");b[j].classList.add(ok?"ok":"bad");if(!ok){b[window.o.indexOf(c[1])].classList.add("ok");if(!S.mist.some(m=>m[0]==c[0]))S.mist.push([c[0],c[1]])}else{sc++;S.kw[c[0]]=1}S.qt++;S.qo+=ok?1:0;snd(ok?"ok":"bad");save();$("#fb").innerHTML=`<button class="btn ${ok?"":"or"}" onclick="qn()">Davom etish</button>`};window.qn=()=>{i++;q()};q()}
const allW=()=>Object.values(V).flat();
const daily=()=>quiz(shuf(allW()).slice(0,10),allW(),"Kunlik mashq",(sc,n)=>{gain(sc*3);snd("win");ov(`<div style="text-align:center;padding-top:60px"><div class="rs"></div><h2>${sc}/${n}</h2><p class="mu">+${sc*3} XP</p><br><button class="btn" onclick="cl()">Yopish</button></div>`)});
function review(){if(!S.mist.length)return msg(" Xatolar daftari bo'sh! Xato qilsangiz, so'zlar shu yerga tushadi.");const L=shuf(S.mist);let i=0;const s=()=>{if(i>=L.length)return cl();ov(hd(i/L.length)+`<h2> Takrorlash</h2><div class="card" style="text-align:center"><div class="de">${L[i][0]}</div><p class="mu" id="tr" style="font-size:20px;margin:10px 0">Tarjimani ko'rish uchun bosing</p></div><button class="btn bl" onclick="$('#tr').textContent='${L[i][1].replace(/'/g,"\\'")}'">Ko'rsatish</button><button class="btn" onclick="rk(1)"> Esladim</button><button class="btn or" onclick="rk(0)"> Yana takror</button>`);say(L[i][0])};window.rk=y=>{if(y){S.mist=S.mist.filter(m=>m[0]!=L[i][0]);gain(5);snd("ok");save()}i++;s()};s()}
R.game=()=>{$("#game").innerHTML=hdr()+`<h2>O'yin</h2><div class="card"><h2 style="font-size:20px"> Artikl Blitz</h2><p class="mu" style="margin-bottom:10px">45 soniyada der/die/das ni toping. Rekord: ${S.best}</p><button class="btn" onclick="blitz()">O'ynash</button></div><div class="card"><h2 style="font-size:20px"> So'z jangi (do'stlar bilan)</h2><p class="mu" style="margin-bottom:10px">Xona oching, do'stlaringiz qo'shilsin, kim ko'p so'z topsa g'olib. Server qismi tayyor bo'lgach ochiladi.</p><button class="btn gr" onclick="msg(' Tez orada! Hozir Artikl Blitz bilan mashq qiling.')"> Tez orada</button></div>`};
function blitz(){const N=shuf(allW().filter(w=>/^(der|die|das) /.test(w[0])));let i=0,sc=0,t=45,a;const iv=setInterval(()=>{t--;const e=$("#tm");if(e)e.textContent="⏱ "+t;if(t<=0){clearInterval(iv);end()}},1000);OVC=()=>clearInterval(iv);
const q=()=>{const w=N[i%N.length][0];a=w.split(" ")[0];ov(hd(1-t/45)+`<div class="row" style="justify-content:space-between"><b id="tm">⏱ ${t}</b><b> ${sc}</b></div><div class="card" style="text-align:center;margin-top:14px"><p class="mu">Qaysi artikl?</p><div class="de">${w.slice(a.length+1)}</div></div><div class="g g3">${["der","die","das"].map(x=>`<button class="btn bl" onclick="ap('${x}')">${x}</button>`).join("")}</div>`)};
window.ap=x=>{if(x==a){sc++;snd("ok");gain(2)}else{snd("bad");t=Math.max(1,t-3)}i++;q()};
const end=()=>{OVC=0;if(sc>S.best)S.best=sc;save();snd("win");ov(`<div style="text-align:center;padding-top:60px"><div class="rs"></div><h2>${sc} ta to'g'ri</h2><p class="mu">Rekord: ${S.best}</p><br><button class="btn" onclick="cl()">Yopish</button></div>`)};q()}
R.dict=()=>{$("#dict").innerHTML=hdr()+`<h2>Lug'at</h2><input id="sq" placeholder="Qidirish..." style="width:100%;padding:12px;border-radius:14px;border:2px solid var(--ln);background:var(--c);color:var(--tx);font-size:16px;margin-bottom:12px"><div id="dl"></div>`;const f=()=>{const s=$("#sq").value.toLowerCase();$("#dl").innerHTML=allW().filter(w=>(w[0]+w[1]).toLowerCase().includes(s)).map(w=>`<div class="card row" style="padding:10px 14px;margin-bottom:8px"><div style="flex:1"><b>${w[0]}</b><div class="mu">${w[1]}</div></div><button class="say" onclick="say(this.dataset.w)" data-w="${w[0]}"><svg class="ic" style="width:20px;height:20px"><use href="#i-vol"/></svg></button></div>`).join("")};$("#sq").oninput=f;f()};
R.plan=()=>{const d=Math.floor((Date.now()-new Date(S.start))/864e5)+1,F=flat();$("#plan").innerHTML=`<div class="row"><button class="x" onclick="go('home')">←</button><h2 style="margin:0">90 kunlik reja</h2></div><p class="mu" style="margin:8px 0 14px">Bugun: ${d}-kun. Har kuni bitta dars va kunlik mashq.</p><div class="days">${[...Array(90)].map((_,i)=>`<div class="day ${i+1<d?"p":i+1==d?"n":""}" onclick="msg('${i+1}-kun: ${i<F.length?F[i].l.t.replace(/'/g,"\\'"):"Takrorlash va mock imtihon"}')">${i+1}</div>`).join("")}</div>`};
const BD=[["Birinchi qadam",()=>S.xp>=10],["3 kunlik streak",()=>S.bs>=3],["7 kunlik streak",()=>S.bs>=7],["100 XP",()=>S.xp>=100],["500 XP",()=>S.xp>=500],["10 ta dars",()=>Object.keys(S.done).length>=10],["50 ta so'z",()=>Object.keys(S.kw).length>=50],["Aniqlik 90%",()=>S.qt>=20&&S.qo/S.qt>=.9]];
R.me=()=>{const u=tg.initDataUnsafe?.user||{},RK=[[0,"Boshlovchi"],[100,"O'rganuvchi"],[500,"Tajribali"],[1500,"Ustoz"]],r=RK.filter(x=>S.xp>=x[0]).pop(),nx=RK.find(x=>x[0]>S.xp),p=nx?(S.xp-r[0])/(nx[0]-r[0]):1,nm=u.first_name||"O'quvchi",acc=S.qt?Math.round(S.qo/S.qt*100):0,d=[...Array(7)].map((_,i)=>ds(6-i)),mx=Math.max(20,...d.map(x=>S.hist[x]||0)),st=(a,b)=>`<div class="card st"><b>${a}</b><span class="mu">${b}</span></div>`;
$("#me").innerHTML=`<div class="card" style="text-align:center">${u.photo_url?`<img class="av" src="${u.photo_url}">`:`<div class="av">${nm[0]}</div>`}<h2 style="margin:0">${nm}</h2><p class="mu">${u.username?"@"+u.username+" · ":""}${r[1]} · ${S.start} dan beri</p><div class="pb" style="margin:14px 0 6px"><i style="width:${p*100}%"></i></div><p class="mu">${nx?S.xp+" / "+nx[0]+" XP":"Eng yuqori daraja"}</p></div>
<div class="g g2">${st(S.streak+" kun","Joriy streak")}${st(S.bs+" kun","Eng uzun streak")}${st(S.xp,"Jami XP")}${st(Object.keys(S.kw).length,"Yodlangan so'zlar")}${st(Object.keys(S.done).length+" / "+flat().filter(x=>x.l.p).length,"Tugagan darslar")}${st(acc+"%","Aniqlik")}${st(Math.floor(S.time/60)+" daq","O'qish vaqti")}${st(S.today+" XP","Bugun")}</div>
<h2 style="font-size:17px">Oxirgi 7 kun</h2><div class="card"><div class="wk">${d.map(x=>`<div><i style="height:${(S.hist[x]||0)/mx*60}px"></i>${["Ya","Du","Se","Ch","Pa","Ju","Sh"][new Date(x).getUTCDay()]}</div>`).join("")}</div></div>
<h2 style="font-size:17px">Yutuqlar</h2><div class="g g2">${BD.map(([n,f])=>`<div class="card st" style="opacity:${f()?1:.4}"><b style="font-size:14px">${n}</b><span class="mu">${f()?"Olingan":"Yopiq"}</span></div>`).join("")}</div>
<h2 style="font-size:17px">Sozlamalar</h2><div class="card"><div class="mu" style="margin-bottom:8px">Kunlik maqsad (XP)</div><div class="row">${[30,50,100].map(n=>`<button class="btn ${S.goal==n?"":"gr"}" style="margin:0" onclick="S.goal=${n};save();R.me()">${n}</button>`).join("")}</div></div>
<button class="btn gr" onclick="S.theme=S.theme=='dark'?'light':'dark';save();theme();R.me()">${S.theme=="dark"?"Yorug' rejim":"Qorong'u rejim"}</button><button class="btn gr" onclick="S.snd=S.snd?0:1;save();R.me()">${S.snd?"Ovoz: yoqilgan":"Ovoz: o'chirilgan"}</button>`};
setInterval(()=>{if(!document.hidden){S.time+=10;save()}},10000);
Promise.all([fetch("vocab.json").then(r=>r.json()),fetch("lessons.json").then(r=>r.json())]).then(([v,t])=>{V=v;T=t;go("home")}).catch(()=>{document.body.innerHTML="<p style='padding:30px'> Fayllar yuklanmadi</p>"});
</script></body></html>
