<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b5bf0">
<title>DeutschPower</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f3f4fb;--card:#fff;--ink:#14162b;--mute:#6b7089;--line:#e5e7f2;--nav:rgba(255,255,255,.88);
  --acc:#5b5bf0;--acc2:#a855f7;--gold:#f5b50a;--ok:#10b981;--bad:#ef4444;--shadow:0 6px 24px rgba(40,40,100,.08);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0d0f1a;--card:#171a2c;--ink:#eef0ff;--mute:#9aa0bf;--line:#262a42;--nav:rgba(23,26,44,.88);--shadow:0 6px 24px rgba(0,0,0,.35)}
}
:root[data-theme="dark"]{--bg:#0d0f1a;--card:#171a2c;--ink:#eef0ff;--mute:#9aa0bf;--line:#262a42;--nav:rgba(23,26,44,.88);--shadow:0 6px 24px rgba(0,0,0,.35)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;line-height:1.45}
body{padding-top:env(safe-area-inset-top,0px)}
#view{max-width:560px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:26px;margin:0;letter-spacing:-.4px}
h2{font-size:18px;margin:22px 0 10px}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;display:flex;align-items:center;gap:16px}
.hero .mute{color:rgba(255,255,255,.8)}
.row{display:flex;gap:10px}.row>*{flex:1}
.stat{text-align:center;padding:12px 6px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mute)}
.btn{border:0;border-radius:14px;padding:14px 16px;font:600 16px inherit;font-family:inherit;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));width:100%}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn:active{transform:scale(.98)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 16px;font:600 14px inherit;font-family:inherit;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.flash{min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;gap:8px}
.flash .de{font-size:32px;font-weight:800;letter-spacing:-.5px}
.flash .uz{font-size:24px;color:var(--acc);font-weight:700}
.flash .ex{color:var(--mute);font-style:italic}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .4s}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px;padding:15px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 16px inherit;font-family:inherit;cursor:pointer}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.q{font-size:24px;font-weight:800;text-align:center;margin:10px 0 18px}
.timer{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}.timer>i{display:block;height:100%;width:100%;background:var(--gold)}
.mode{display:flex;gap:14px;align-items:center;cursor:pointer}.mode .ic{font-size:34px}
.w{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.w:last-child{border:0}.w .t{flex:1}.w b{display:block}.w small{color:var(--mute)}
.icon{border:0;background:var(--line);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer}
input.search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px inherit;font-family:inherit;margin-bottom:10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mute);font:600 11px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:22px;filter:grayscale(1);opacity:.7;transition:.2s}
nav button.on{color:var(--acc)}nav button.on span{filter:none;opacity:1;transform:translateY(-2px)}
.pop{animation:pop .35s ease}@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.big{font-size:56px;text-align:center}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="view"></main>
<nav id="nav" aria-label="Asosiy menyu"></nav>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){tg.ready();tg.expand();if(tg.colorScheme)document.documentElement.dataset.theme=tg.colorScheme;}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hap=t=>{try{tg&&tg.HapticFeedback&&(t==='ok'||t==='bad'?tg.HapticFeedback.notificationOccurred(t==='ok'?'success':'error'):tg.HapticFeedback.impactOccurred('light'))}catch(e){}};
const GOAL=50, RANKS=[[0,'🌱 Anfänger'],[100,'🔍 Entdecker'],[500,'⚡ Profi'],[1500,'👑 Meister']];
let V={A1:[['das Wasser','Suv','Ich trinke Wasser.'],['das Brot','Non','Das Brot ist frisch.'],['die Tür','Eshik','Die Tür ist offen.'],['der Tisch','Stol','Der Tisch ist neu.'],['das Haus','Uy','Das Haus ist groß.']]};
fetch('vocab.json').then(r=>r.json()).then(j=>{V=j;go(tab)}).catch(()=>{});

/* ---------- holat (localStorage) ---------- */
const DEF={xp:0,streak:0,last:'',level:'A1',ok:0,total:0,dxp:0,dday:'',known:{}};
const day=()=>new Date().toISOString().slice(0,10);
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem('dp5')||'{}'))}catch(e){S=Object.assign({},DEF)}
const save=()=>{try{localStorage.setItem('dp5',JSON.stringify(S))}catch(e){}};
(function(){const t=day(),y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(S.last!==t){S.streak=S.last===y?S.streak+1:1;S.last=t}
  if(S.dday!==t){S.dday=t;S.dxp=0}save()})();
function addXp(n,ok){S.xp+=n;S.dxp+=n;if(ok!==undefined){S.total++;if(ok)S.ok++}save()}
const rank=x=>RANKS.filter(r=>x>=r[0]).pop()[1];
const nextRank=x=>{const lo=RANKS.filter(r=>x>=r[0]).pop()[0],hi=(RANKS.find(r=>r[0]>x)||[null])[0];return hi===null?[1,null]:[(x-lo)/(hi-lo),hi]};
const words=()=>V[S.level]||V.A1;
const speak=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.9;speechSynthesis.speak(u)}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const name=()=>(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)||'Do’st';
const chips=(cur,fn)=>`<div class="chips">${Object.keys(V).map(l=>`<button class="chip ${l===cur?'on':''}" onclick="${fn}('${l}')">${l}</button>`).join('')}</div>`;

/* ---------- navigatsiya ---------- */
const TABS=[['home','🏠','Bosh'],['learn','📚','O’rganish'],['game','🎮','O’yin'],['vocab','🔤','Lug’at'],['me','👤','Profil']];
let tab='home';
function go(t){tab=t;
  $('#nav').innerHTML=TABS.map(x=>`<button class="${x[0]===t?'on':''}" onclick="go('${x[0]}')" aria-label="${x[2]}"><span>${x[1]}</span>${x[2]}</button>`).join('');
  ({home,learn,game,vocab,me})[t]();window.scrollTo(0,0);hap()}
const view=h=>{$('#view').innerHTML=`<div class="pop">${h}</div>`};

/* ---------- Bosh ---------- */
function home(){
  const p=Math.min(S.dxp/GOAL,1),C=2*Math.PI*34,w=words(),dw=w[(parseInt(day().replace(/-/g,''))%w.length)];
  view(`<div class="mute">Salom 👋</div><h1>${esc(name())}</h1><div style="height:14px"></div>
  <div class="card hero"><svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="34" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="9"/><circle cx="42" cy="42" r="34" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 42 42)"/><text x="42" y="48" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">${Math.round(p*100)}%</text></svg>
  <div><b style="font-size:18px">${p>=1?'Maqsad bajarildi! 🎉':'Kunlik maqsad'}</b><div class="mute">${Math.min(S.dxp,GOAL)} / ${GOAL} XP</div></div></div>
  <div class="row"><div class="card stat"><b>🔥 ${S.streak}</b><span>kun streak</span></div><div class="card stat"><b>⭐ ${S.xp}</b><span>XP</span></div><div class="card stat"><b>🎓 ${S.level}</b><span>daraja</span></div></div>
  <h2>Kun so’zi</h2><div class="card"><div style="display:flex;align-items:center;gap:10px"><div style="flex:1"><b style="font-size:22px">${esc(dw[0])}</b><div style="color:var(--acc);font-weight:700">${esc(dw[1])}</div><div class="mute"><i>${esc(dw[2])}</i></div></div><button class="icon" onclick="speak('${esc(dw[0]).replace(/'/g,'’')}')" aria-label="Talaffuz">🔊</button></div></div>
  <div class="row"><button class="btn" onclick="go('learn')">📚 O’rganish</button><button class="btn sec" onclick="go('game')">🎮 O’ynash</button></div>`)}

/* ---------- O'rganish (flashcards) ---------- */
let L={q:[],i:0,flip:false,lv:null};
function learn(){
  if(L.lv!==S.level||!L.q.length){L={q:shuffle(words().filter(x=>!S.known[x[0]])),i:0,flip:false,lv:S.level}}
  const w=words(),kn=w.filter(x=>S.known[x[0]]).length,c=L.q[L.i];
  let body;
  if(!c){body=`<div class="card"><div class="big">🏆</div><h2 style="text-align:center">Bu daraja tugadi!</h2><p class="mute" style="text-align:center">Barcha so’zlarni bildingiz yoki takrorlab chiqdingiz.</p><button class="btn" onclick="resetLevel()">Qayta boshlash</button></div>`}
  else{body=`<div class="card flash" onclick="L.flip=!L.flip;hap();learn()" role="button" tabindex="0"><div class="de">${esc(c[0])}</div>${L.flip?`<div class="uz">${esc(c[1])}</div><div class="ex">${esc(c[2])}</div>`:`<div class="mute">Tarjimani ko’rish uchun bosing</div>`}</div>
  <div class="row" style="margin-bottom:10px"><button class="btn sec" onclick="speak(L.q[L.i][0])">🔊 Eshitish</button></div>
  <div class="row"><button class="btn bad" onclick="lAns(0)">↺ Takror</button><button class="btn ok" onclick="lAns(1)">✓ Bilaman</button></div>`}
  view(`<h1>O’rganish</h1>${chips(S.level,'setLevel')}<div class="bar" style="margin-bottom:14px"><i style="width:${w.length?kn/w.length*100:0}%"></i></div><div class="mute" style="margin-bottom:12px">${kn} / ${w.length} so’z o’zlashtirildi</div>${body}`)}
function lAns(ok){const c=L.q[L.i];if(ok){S.known[c[0]]=1;addXp(3);hap('ok')}else{L.q.push(c);hap('bad')}L.i++;L.flip=false;save();learn()}
function resetLevel(){words().forEach(x=>delete S.known[x[0]]);save();L.lv=null;learn()}
function setLevel(l){S.level=l;L.lv=null;save();go(tab)}

/* ---------- O'yin (quiz) ---------- */
let G=null;
function game(){
  if(!G){return view(`<h1>O’yin</h1><p class="mute">10 ta savol, 12 soniya, combo uchun qo’shimcha XP!</p>${chips(S.level,'setLevel')}
  <div class="card mode" onclick="startGame('tr')" role="button" tabindex="0"><div class="ic">🇩🇪</div><div><b>Tarjima</b><div class="mute">Nemischa so’zning ma’nosini toping</div></div></div>
  <div class="card mode" onclick="startGame('rev')" role="button" tabindex="0"><div class="ic">🇺🇿</div><div><b>Teskari</b><div class="mute">O’zbekchasiga nemischa so’zni toping</div></div></div>
  <div class="card mode" onclick="startGame('art')" role="button" tabindex="0"><div class="ic">🧩</div><div><b>Artikl</b><div class="mute">der, die yoki das?</div></div></div>`)}
  if(G.done){const gain=G.xp;return view(`<div class="card" style="text-align:center"><div class="big">${G.score>=8?'🏆':G.score>=5?'👏':'💪'}</div><h1>${G.score} / ${G.n}</h1><p class="mute">Eng uzun combo: ${G.best} • +${gain} XP</p><button class="btn" onclick="startGame('${G.mode}')">Yana o’ynash</button><div style="height:10px"></div><button class="btn sec" onclick="G=null;game()">Menyu</button></div>`)}
  const q=G.cur;
  view(`<div class="row" style="align-items:center;margin-bottom:8px"><span class="mute">Savol ${G.i+1}/${G.n}</span><span style="text-align:right;font-weight:700">🔥 ${G.combo}</span></div>
  <div class="timer"><i id="tm"></i></div><div class="q">${esc(q.text)}</div>${q.opts.map((o,i)=>`<button class="opt" onclick="gAns(${i})">${esc(o)}</button>`).join('')}`);
  clearTimeout(G.t);const tm=$('#tm');tm.style.transition='none';tm.style.width='100%';void tm.offsetWidth;tm.style.transition='width 12s linear';tm.style.width='0%';
  G.t=setTimeout(()=>gAns(-1),12000)}
function mkQ(mode){const w=words(),art=w.filter(x=>/^(der|die|das) /i.test(x[0]));
  if(mode==='art'&&art.length){const x=art[Math.random()*art.length|0],[a,n]=[x[0].split(' ')[0].toLowerCase(),x[0].split(' ').slice(1).join(' ')],o=['der','die','das'];return{text:`___ ${n}`,opts:o,right:o.indexOf(a)}}
  const x=w[Math.random()*w.length|0],others=shuffle(w.filter(y=>y[0]!==x[0]&&y[1]!==x[1])).slice(0,3);
  const rev=mode==='rev',opts=shuffle([rev?x[0]:x[1],...others.map(y=>rev?y[0]:y[1])]);
  return{text:rev?`«${x[1]}» — nemischasi?`:`«${x[0]}» — o’zbekchasi?`,opts,right:opts.indexOf(rev?x[0]:x[1])}}
function startGame(mode){G={mode,i:0,n:10,score:0,combo:0,best:0,xp:0,lock:false,done:false};G.cur=mkQ(mode);game()}
function gAns(i){if(G.lock)return;G.lock=true;clearTimeout(G.t);const q=G.cur,ok=i===q.right;
  document.querySelectorAll('.opt').forEach((b,k)=>{if(k===q.right)b.classList.add('right');else if(k===i)b.classList.add('wrong')});
  if(ok){G.score++;G.combo++;G.best=Math.max(G.best,G.combo);const x=10+Math.min(G.combo,5)*2;G.xp+=x;addXp(x,true);hap('ok')}else{G.combo=0;G.xp+=1;addXp(1,false);hap('bad')}
  setTimeout(()=>{G.i++;G.lock=false;if(G.i>=G.n)G.done=true;else G.cur=mkQ(G.mode);game()},900)}

/* ---------- Lug'at ---------- */
let VQ='',open_=-1;
function vocab(){view(`<h1>Lug’at</h1>${chips(S.level,'setLevel')}<input class="search" id="vs" placeholder="🔍 Qidirish…" value="${esc(VQ)}" oninput="VQ=this.value;open_=-1;vlist()" aria-label="Qidirish"><div class="card" id="vl" style="padding:8px 16px"></div>`);vlist()}
function vlist(){const q=VQ.trim().toLowerCase(),l=words().map((x,i)=>[x,i]).filter(([x])=>!q||x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q)).slice(0,80);
  $('#vl').innerHTML=l.length?l.map(([x,i])=>`<div class="w" onclick="open_=open_===${i}?-1:${i};vlist()"><div class="t"><b>${esc(x[0])}</b><small>${esc(x[1])}</small>${open_===i?`<div class="mute" style="margin-top:6px"><i>${esc(x[2])}</i></div>`:''}</div><button class="icon" onclick="event.stopPropagation();speak(words()[${i}][0])" aria-label="Talaffuz">🔊</button></div>`).join(''):'<p class="mute">Hech narsa topilmadi</p>'}

/* ---------- Profil ---------- */
function me(){const [p,hi]=nextRank(S.xp),acc=S.total?Math.round(S.ok/S.total*100):0,kn=Object.keys(S.known).length;
  view(`<div class="card" style="text-align:center"><div style="width:76px;height:76px;margin:0 auto 10px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;font-size:34px;font-weight:800">${esc(name()[0].toUpperCase())}</div><h1>${esc(name())}</h1><div style="font-weight:700;margin:6px 0">${rank(S.xp)}</div><div class="bar"><i style="width:${p*100}%"></i></div><div class="mute" style="margin-top:6px">${hi?`Keyingi daraja: ${hi} XP`:'Eng yuqori daraja!'}</div></div>
  <div class="row"><div class="card stat"><b>⭐ ${S.xp}</b><span>XP</span></div><div class="card stat"><b>🔥 ${S.streak}</b><span>streak</span></div></div>
  <div class="row"><div class="card stat"><b>🎯 ${acc}%</b><span>aniqlik</span></div><div class="card stat"><b>📚 ${kn}</b><span>bilgan so’z</span></div></div>
  <h2>Daraja</h2>${chips(S.level,'setLevel')}
  <button class="btn sec" style="margin-top:8px" onclick="if(confirm('Hamma natijalar o’chadi. Davom etasizmi?')){localStorage.removeItem('dp5');location.reload()}">🗑 Natijalarni tozalash</button>`)}

go('home');
</script>
</body>
</html>
